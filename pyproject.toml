[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "accesspilot"
# 版本号**不在这里写**。写两遍就会漂移: 曾经 pyproject 与 install 包、安装器
# 各自写着 1.0.0 / 0.9.0, 没有任何东西对账, 最后发布出去的安装包名字是 v0.9.0。
# 唯一来源是 accesspilot/__init__.py 的 __version__。
dynamic = ["version"]
description = "加速访问并正常使用 ChatGPT / Discord / X 等平台的客户端管理器"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AccessPilot Contributors" }]
keywords = ["proxy", "clash", "mihomo", "chatgpt", "discord", "tun", "gfw"]
classifiers = [
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: Proxy Servers",
]
# 刻意不依赖任何第三方库: 目标机器常常无法访问 PyPI
dependencies = []

[project.scripts]
accesspilot = "accesspilot.cli:main"

[tool.setuptools]
packages = ["accesspilot"]

# 版本号的唯一来源(见上面 dynamic = ["version"] 的说明)。
[tool.setuptools.dynamic]
version = { attr = "accesspilot.__version__" }

[tool.setuptools.package-data]
accesspilot = ["assets/*.html"]
